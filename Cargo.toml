[package]
name = "hamd-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"       # Optimize for minimum binary size
lto = true            # Link-Time Optimization across all crates
codegen-units = 1     # Maximize LTO optimization depth
panic = "abort"       # Remove heavy stack-unwinding code
strip = true          # Strip debug symbols and names

[dependencies]
aes-gcm = "0.11.0"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
hex = "0.4.3"
js-sys = "0.3.104"
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
web-sys = { version = "0.3.104", features = [
    "BroadcastChannel",
    "DomException",
    "DomStringList",
    "Document",
    "Event",
    "EventTarget",
    "MessageEvent",
    "HtmlDocument",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "Storage",
    "Window",
] }
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }
