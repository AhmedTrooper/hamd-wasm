[package]
name = "hamd-wasm"
version = "0.1.0"
edition = "2024"
description = "Unified, encrypted, type-safe browser storage — five backends (localStorage, sessionStorage, cookies, memory, IndexedDB) with AES-256-GCM, TTL, and cross-tab sync, built in Rust and compiled to WebAssembly"
license = "MIT"
repository = "https://github.com/AhmedTrooper/hamd-wasm"
readme = "README.md"
keywords = ["storage", "localstorage", "indexeddb", "encryption", "wasm"]
categories = ["wasm", "web-programming"]
authors = ["Md. Ramjan Miah <ramjan@example.com>"]
homepage = "https://github.com/AhmedTrooper/hamd-wasm#readme"
documentation = "https://docs.rs/hamd-wasm"
exclude = ["pkg/", "target/", ".github/"]

[lib]
crate-type = ["cdylib", "rlib"]

# Bundled wasm-opt (binaryen 117) needs modern wasm features enabled explicitly.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-sign-ext",
    "--enable-mutable-globals",
    "--enable-nontrapping-float-to-int",
]

[profile.release]
opt-level = "z"       # Optimize for minimum binary size
lto = true            # Link-Time Optimization across all crates
codegen-units = 1     # Maximize LTO optimization depth
panic = "abort"       # Remove heavy stack-unwinding code
strip = true          # Strip debug symbols and names

[dependencies]
aes-gcm = "0.11.0"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
hex = "0.4.3"
js-sys = "0.3.104"
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
web-sys = { version = "0.3.104", features = [
    "BroadcastChannel",
    "DomException",
    "DomStringList",
    "Document",
    "Event",
    "EventTarget",
    "Location",
    "MessageEvent",
    "StorageEvent",
    "HtmlDocument",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "Storage",
    "Window",
] }
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
